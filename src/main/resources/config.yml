extraction-points:
  # Mundo donde aparecen los puntos
  world: "server"
  
  # Radio desde el spawn del mundo para generar puntos aleatorios
  spawn-radius: 500
  
  # Radio del área del círculo de extracción (en bloques)
  point-radius: 5
  
  # Tiempo necesario dentro del área para extraerse (segundos)
  extraction-time: 20
  
  # Cantidad de puntos activos simultáneamente
  max-points: 3
  
  # Intervalo de regeneración de puntos (segundos). Cuando un punto se usa, aparece uno nuevo.
  # También checkea periódicamente y reposiciona puntos si hace falta
  respawn-interval: 60
  
  # Y mínimo y máximo para generar puntos
  min-y: 60
  max-y: 120
  
  # Comandos ejecutados al extraerse (desde consola por defecto)
  # Placeholders: {player}, {x}, {y}, {z}, {world}, {point-x}, {point-y}, {point-z}
  commands:
    - command: "home {player}"
      as-console: true
      delay-ticks: 0
  
  # Mensajes (soporta color codes con &)
  messages:
    extraction-start: "&a&lEXTRACCIÓN &eQuédate en el área {time} segundos para extraerte!"
    extraction-progress: "&eExtrayendo... &f{remaining} segundos restantes"
    extraction-success: "&a&lEXTRACCIÓN COMPLETA &e¡Volviendo a tu isla!"
    extraction-cancelled: "&cExtracción cancelada — saliste del área"
    not-in-area: "&cNo estás en un punto de extracción"
    
  # Efectos visuales
  effects:
    beam-particle: "END_ROD"
    circle-particle: "FLAME"
    beam-height: 30
    circle-density: 20
    extraction-sound: "ENTITY_ENDERMAN_TELEPORT"
    extraction-sound-volume: 1.0
    extraction-sound-pitch: 1.0

# Comando admin /extractionpoints (alias: /ep)
admin:
  messages:
    reload: "&a[ExtractionPoints] Configuración recargada."
    no-permission: "&cNo tienes permiso."
    usage: "&e/extractionpoints <reload|list|spawn|remove>"
    point-spawned: "&aPunto de extracción generado en &e{x} {y} {z}"
    point-removed: "&aPunto de extracción eliminado."
    points-list: "&ePuntos activos: &f{count}"
